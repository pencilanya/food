      {id:'meringue',name:'Меренговый рулет с малиной, 125 г',price:189,category:'snack',image:'assets/history-meringue.webp',allergens:['egg','milk'],source:'История MCP'},
      {id:'hummus',name:'Хумус Самокат, 150 г',price:229,category:'side',image:'assets/history-hummus.jpg',allergens:['sesame'],source:'История MCP'},
      {id:'olives',name:'Маслины Самокат без косточки, 330 г',price:199,category:'side',short:'О',allergens:[],pack:'large',source:'История MCP'}
    ];
    const examplePriority=['sandwich','redbox','apple','blueberry','yogurt','crisps','hummus','croissant','meringue','cherries','tomatoes'];
    const categories=[['all','Все'],['main','Основное'],['snack','Перекус'],['fresh','Фрукты и овощи'],['side','Добавки']];
    const allergenOptions=[['nuts','Орехи'],['peanuts','Арахис'],['milk','Молоко'],['gluten','Глютен'],['egg','Яйцо'],['soy','Соя'],['fish','Рыба'],['sesame','Кунжут']];
    const analysisLabels=['Подключаем историю покупок','Находим знакомые продукты','Сравниваем категории и цены','Готовим подсказки для ребёнка'];
    const state={step:0,child:'mila',addresses:new Set(['home','school']),likes:new Set(['sandwich','apple']),cart:new Set(),cartReady:false,productCategory:'all',budget:550,limits:new Set(),analysis:0,analysisLoading:false,orderMode:'tomorrow',orderOwner:null,subscriptionFrequency:'weekdays'};
    let analysisTimers=[];
    const app=document.querySelector('#app'),bar=document.querySelector('#bar'),phone=document.querySelector('.phone');
    const child=()=>children.find(item=>item.id===state.child);
    const childName=(form)=>child().name==='Мила'?{acc:'Милу',gen:'Милы',dat:'Миле'}[form]:{acc:'Льва',gen:'Льва',dat:'Льву'}[form];
    const allergenLabels={nuts:'орехи',peanuts:'арахис',milk:'молоко',gluten:'глютен',egg:'яйцо',soy:'соя',fish:'рыба',sesame:'кунжут'};
    const blockedProducts=()=>products.filter(p=>p.pack!=='large'&&p.allergens.some(item=>state.limits.has(item)));
    const safeProducts=()=>products.filter(p=>p.pack!=='large'&&!p.allergens.some(item=>state.limits.has(item)));
    const safeExampleProducts=()=>{
      const safe=safeProducts();
      const candidates=[];
      ['main','fresh','snack','side'].forEach(category=>{
        const match=examplePriority.map(id=>safe.find(p=>p.id===id)).find(p=>p&&p.category===category&&!candidates.includes(p));
        if(match)candidates.push(match);
      });
      examplePriority.map(id=>safe.find(p=>p.id===id)).filter(Boolean).forEach(p=>{if(!candidates.includes(p))candidates.push(p)});
      const picked=[];
      candidates.forEach(p=>{if(picked.length<4&&picked.reduce((sum,item)=>sum+item.price,0)+p.price<=state.budget)picked.push(p)});
      if(!picked.length&&candidates.length)picked.push(candidates[0]);
      return picked;
    };
    const exampleTotal=()=>safeExampleProducts().reduce((sum,item)=>sum+item.price,0);
    const visibleProducts=()=>safeProducts().filter(p=>state.productCategory==='all'||p.category===state.productCategory);
    const productPhoto=(p)=>p.image?`<span class="product-photo"><img src="${p.image}" alt="${p.name}" loading="lazy"></span>`:`<span class="product-photo product-photo-placeholder ${p.category}"><strong>${p.short||p.name.slice(0,1)}</strong><small>фото обновляется</small></span>`;
    const productGrid=(mode)=>visibleProducts().length?visibleProducts().map(p=>`<button class="product ${state[mode].has(p.id)?'selected':''}" onclick="${mode==='likes'?'toggleLike':'toggleCart'}('${p.id}')">${productPhoto(p)}<strong>${p.name}</strong><small>${p.price} ₽ · ${state[mode].has(p.id)?mode==='likes'?'нравится':'в заказе':mode==='likes'?'не выбрано':'добавить'}</small></button>`).join(''):`<div class="catalog-empty">В этой категории не осталось безопасных вариантов. Измените категорию или проверьте отмеченные ограничения.</div>`;
    const categoryTabs=()=>`<div class="category-tabs" role="tablist" aria-label="Категории товаров">${categories.map(([id,label])=>`<button class="${state.productCategory===id?'selected':''}" onclick="setProductCategory('${id}')">${label}</button>`).join('')}</div>`;
    const next=()=>{state.step++;render()}; const back=()=>{clearAnalysis();state.step=Math.max(0,state.step-1);render()};
    const shell=(html)=>`<section class="screen">${state.step&&state.step!==9?`<div class="top-actions"><button class="back" onclick="back()">← Назад</button></div>`:''}${html}</section>`;
    function render(){bar.style.width=`${Math.max(8,(state.step+1)/11*100)}%`;document.querySelector('#profileButton').style.display=state.step>=9?'grid':'none';phone.scrollTo(0,0);
      if(state.step===0) app.innerHTML=shell(`<span class="eyebrow">Новый семейный ритуал</span><h1>Ланч, который ребёнку правда хочется открыть</h1><p>Боксик помогает собрать прикольный и полезный школьный ланч из актуальных продуктов. ИИ учитывает вкусы ребёнка, ограничения и бюджет — последнее слово всегда за вами.</p><div class="hero"><img src="assets/lunchbox-open-cutout.png" alt="Яркий школьный ланч-бокс"></div><button class="button" onclick="next()">Начать знакомство →</button><small class="fine">Ничего не закажем без вашего подтверждения</small>`);
      if(state.step===1) app.innerHTML=shell(`<div class="connect-art"><img src="assets/lunchbox-closed-cutout-v2.png" alt="Закрытый школьный бокс" style="width:100%;filter:drop-shadow(0 18px 20px rgba(27,30,20,.18));transform:rotate(5deg)"></div><span class="eyebrow">Шаг 1 · подключение</span><h1>Давайте узнаем, что любит ваша семья</h1><p>После входа ИИ-агент посмотрит прошлые заказы в Самокате через защищённое подключение MCP и найдёт привычные продукты, вкусы и диапазон цен.</p><ul class="facts"><li><b>🔎</b><span><strong>Только чтение</strong><small>Агент анализирует историю, но не меняет заказы.</small></span></li><li><b>🛡</b><span><strong>Вы всё контролируете</strong><small>Любой вывод можно поправить или удалить.</small></span></li></ul><button class="button" onclick="next()">Подключить Sber ID →</button><small class="fine">В демо вход показан как часть сценария авторизации</small>`);
      if(state.step===2) app.innerHTML=shell(`<span class="eyebrow">Шаг 2 · доставка</span><h1>Куда можно привезти ланч?</h1><p>Добавьте минимум два привычных места. Боксик проверит зону доставки Самоката для каждого адреса.</p><div class="address-grid">${addressOptions.map(a=>`<button class="address-card ${state.addresses.has(a.id)?'selected':''}" onclick="toggleAddress('${a.id}')"><span class="address-mark">${a.mark}</span><span class="address-copy"><strong>${a.name}</strong><small>${state.addresses.has(a.id)?'Адрес добавлен · доставляем':a.hint}</small></span><span class="address-state">${state.addresses.has(a.id)?'✓':'＋'}</span></button>`).join('')}</div><div class="delivery-note"><span class="delivery-dot"></span><span>${state.addresses.size>=2?`Самокат доставляет по ${state.addresses.size} адресам. Можно продолжать.`:'Добавьте ещё один адрес, чтобы продолжить.'}</span></div><button class="button" ${state.addresses.size<2?'disabled':''} onclick="next()">Продолжить с ${state.addresses.size} ${state.addresses.size===1?'адресом':'адресами'} →</button>`);
      if(state.step===3) app.innerHTML=shell(`<span class="eyebrow">Данные из Sber ID</span><h1>Для кого собираем первый бокс?</h1><p>Нашли два детских профиля. Выберите ребёнка — вкусы и ограничения будут храниться отдельно.</p><div class="family">${children.map(c=>`<button class="child ${state.child===c.id?'selected':''}" onclick="state.child='${c.id}';render()"><i class="avatar">${c.avatar}</i><span><strong>${c.name}</strong><small>${c.age} лет · профиль ребёнка</small></span><b>${state.child===c.id?'✓':'→'}</b></button>`).join('')}<button class="child"><i class="avatar">＋</i><span><strong>Добавить ребёнка</strong><small>Если кого-то нет в списке</small></span><b>→</b></button></div><button class="button" onclick="next()">Выбрать: ${child().name} →</button>`);
      if(state.step===4) app.innerHTML=state.analysisLoading?shell(`<div class="agent-loading" aria-live="polite"><section class="agent-box-scene" aria-label="Продукты по очереди складываются в открытую коробку"><span class="agent-box-glow" aria-hidden="true"></span><img class="agent-drop agent-drop-sandwich" src="assets/product-sandwich.png" alt=""><img class="agent-drop agent-drop-apple" src="assets/product-apple.png" alt=""><img class="agent-drop agent-drop-yogurt" src="assets/product-yogurt.png" alt=""><img class="agent-drop agent-drop-crisps" src="assets/product-crisps.png" alt=""><img class="agent-grocery-box" src="assets/open-grocery-box-v1.png" alt="Открытая коробка для продуктов"></section><span class="eyebrow">ИИ-агент собирает бокс</span><h1>Ищем идеи для ${childName('gen')}</h1><p>Смотрим семейные покупки Самоката и берём только знакомые продукты.</p><div class="agent-progress"><div class="agent-progress-copy"><span>${analysisLabels[Math.max(0,state.analysis-1)]}</span><span>${Math.max(1,state.analysis)} из 4</span></div><div class="agent-track" aria-hidden="true"><i style="width:${Math.max(1,state.analysis)*25}%"></i></div></div><small class="agent-privacy">Только чтение — заказы и корзина останутся без изменений.</small></div>`):shell(`<span class="eyebrow">Следующий шаг</span><h1>Теперь посмотрим семейные покупки</h1><p>История Самоката общая. ИИ-агент найдёт подходящие продукты, а вы подскажете, что из этого любит именно ${child().name}.</p><ul class="facts"><li><b>🔎</b><span><strong>Только чтение</strong><small>Заказы и корзина не изменятся.</small></span></li><li><b>✨</b><span><strong>Меньше вопросов</strong><small>Начнём со знакомых семье продуктов.</small></span></li><li><b>🛡</b><span><strong>Контроль у родителя</strong><small>Любой вывод можно удалить.</small></span></li></ul><button class="button" onclick="startAnalysis()">Посмотреть, что нашёл агент →</button>`);
      if(state.step===5) app.innerHTML=shell(`<span class="eyebrow">Уточним про ${childName('acc')}</span><h1>Что нравится ${childName('dat')}?</h1><p>ИИ нашёл ${safeProducts().length} небольших товаров из истории MCP. Отметьте то, что любит ${child().name}.</p>${categoryTabs()}<p class="catalog-note">${state.limits.size?`Фильтр активен: скрываем товары с аллергенами — ${[...state.limits].map(item=>allergenLabels[item]).join(', ')}. Исключено: ${blockedProducts().length}.`:'На следующем шаге укажите аллергены — выбранные товары тоже будут перепроверены.'}</p><div class="products">${productGrid('likes')}</div><button class="button" onclick="next()">Продолжить →</button>`);
      if(state.step===6) app.innerHTML=shell(`<span class="eyebrow">Важно для безопасности</span><h1>Что ${child().name==='Мила'?'Миле':'Льву'} нельзя?</h1><p>Аллергии и медицинские ограничения не определяются по покупкам. Их всегда указывает родитель.</p><div class="chips">${allergenOptions.map(([id,label])=>`<button class="chip ${state.limits.has(id)?'selected':''}" onclick="toggleLimit('${id}')">${label}</button>`).join('')}</div><div class="filter-impact"><b>${blockedProducts().length}</b><span><strong>${blockedProducts().length?'товаров исключено':'Все товары доступны'}</strong><small>${state.limits.size?`Не предложим позиции с аллергенами: ${[...state.limits].map(item=>allergenLabels[item]).join(', ')}. Уже выбранные неподходящие товары удалены.`:'Отметьте ограничения — список рекомендаций изменится сразу.'}</small></span></div><button class="button" style="margin-top:auto" onclick="next()">Сохранить ограничения →</button>`);
      if(state.step===7) app.innerHTML=shell(`<span class="eyebrow">Последняя настройка</span><h1>Бюджет одного бокса</h1><p>По актуальным ценам Самоката похожий набор получается примерно на 350–550 ₽. Но комфортную сумму выбираете вы.</p><div class="budget"><button onclick="state.budget=Math.max(350,state.budget-50);render()">−</button><strong>${state.budget} ₽</strong><button onclick="state.budget=Math.min(1000,state.budget+50);render()">+</button></div><div class="notice">✨ Боксик будет сначала искать знакомые товары и не предлагать наборы дороже лимита.</div><button class="button" style="margin-top:auto" onclick="next()">Собрать первый вариант →</button>`);
      if(state.step===8) app.innerHTML=shell(`<span class="eyebrow">Пример для ${childName('gen')}</span><h1>Вот каким может быть первый бокс</h1><p>Это пример на основе семейных покупок — пока ничего не выбрано и не заказано. Дальше решите, кто соберёт реальный заказ.</p>${state.limits.size?`<div class="delivery-note"><span class="delivery-dot"></span><span>Учли ограничения: ${[...state.limits].map(item=>allergenLabels[item]).join(', ')}. Неподходящие позиции заменены.</span></div>`:''}<div class="box">${safeExampleProducts().map(p=>`<article>${productPhoto(p)}<small>${p.category==='main'?'Основное':p.category==='fresh'?'Фрукт или овощ':p.category==='side'?'Добавка':'Перекус'}</small><strong>${p.name}</strong><b>${p.price} ₽</b></article>`).join('')}</div><div class="summary"><span><small>Пример · лимит ${state.budget} ₽</small><strong>Вариант бокса</strong></span><b>${exampleTotal()} ₽</b></div><button class="button" onclick="next()">Выбрать, кто соберёт →</button>`);
      if(state.step===9) app.innerHTML=shell(`<section class="order-panel"><div class="order-food-art" aria-hidden="true"><img class="order-food-open" src="assets/lunchbox-open-cutout.png" alt=""><img class="order-food-closed" src="assets/lunchbox-closed-cutout-v2.png" alt=""></div><div class="order-heading"><span class="order-avatar">${child().avatar}</span><span class="eyebrow">Ланч · ${child().name}</span><h1>Когда нужен ланч?</h1><p>Выберите ближайшую доставку или запланируйте заказы заранее.</p></div><div class="quick-dates" role="group" aria-label="Дата заказа"><button class="${state.orderMode==='today'?'selected':''}" onclick="setOrderMode('today')"><span>Сегодня</span><small>${dateLabel(0)}</small></button><button class="${state.orderMode==='tomorrow'?'selected':''}" onclick="setOrderMode('tomorrow')"><span>Завтра</span><small>${dateLabel(1)}</small></button></div><div class="planning-options"><button class="${state.orderMode==='scheduled'?'selected':''}" onclick="setOrderMode('scheduled')"><span>Выбрать другую дату</span><small>Предзаказ на любой удобный день</small></button><button class="${state.orderMode==='subscription'?'selected':''}" onclick="setOrderMode('subscription')"><span>Оформить подписку</span><small>Регулярные доставки без повторного заказа</small></button></div>${state.orderMode==='scheduled'?`<label class="schedule-control"><strong>Дата доставки</strong><input type="date"></label>`:''}${state.orderMode==='subscription'?`<fieldset class="subscription-control"><legend><strong>Как часто доставлять?</strong></legend><div>${[['weekdays','По будням'],['three','3 раза в неделю'],['daily','Каждый день']].map(([value,label])=>`<button class="${state.subscriptionFrequency===value?'selected':''}" onclick="setSubscriptionFrequency('${value}')">${label}</button>`).join('')}</div></fieldset>`:''}<div class="order-divider"></div><section class="owner-choice"><span class="order-step">Кто соберёт заказ?</span><div class="owner-switch"><button onclick="chooseOrderOwner('parent')"><strong>Я закажу</strong><small>Выберу реальные товары и оформлю заказ</small></button><button onclick="chooseOrderOwner('child')"><strong>${child().name} соберёт</strong><small>Ребёнок выберет, вы подтвердите заказ</small></button></div><p>Нажмите на вариант — сразу откроется следующий шаг.</p></section><div class="order-sync"><span>Данные обновляются автоматически</span><button>Обновить</button></div><button class="restart-flow" onclick="resetFlow()">↻ Перезапустить первый запуск</button></section>`);
      if(state.step===10&&state.orderOwner==='parent') app.innerHTML=shell(`<span class="eyebrow">Заказ собираете вы</span><h1>Выберите товары для ${childName('gen')}</h1><p>Пример помог определить направление. Теперь добавьте в реальный заказ подходящие товары из актуального каталога Самоката.</p>${categoryTabs()}<p class="catalog-note">${safeProducts().length} вариантов · исключено по аллергенам: ${blockedProducts().length} · большие упаковки не показываем.</p><div class="products">${productGrid('cart')}</div>${state.cartReady?'<div class="notice">✓ Состав сохранён и готов к родительской проверке.</div>':''}<button class="button" ${state.cart.size?'':'disabled'} onclick="confirmCart()">${state.cartReady?'Состав выбран ✓':state.cart.size?`Проверить заказ · ${state.cart.size} шт. →`:'Добавьте хотя бы один товар'}</button><small class="fine">Оплата появится только после проверки состава и стоимости.</small>`);
      if(state.step===10&&state.orderOwner==='child') app.innerHTML=shell(`<span class="eyebrow">Задание для ${childName('gen')}</span><h1>${child().name} соберёт бокс</h1><p>Ребёнок получит задание выбрать продукты для указанной даты. После сборки вы увидите состав, стоимость и сможете подтвердить заказ.</p><ul class="facts"><li><b>1</b><span><strong>${child().name} выбирает продукты</strong><small>Только из доступных и разрешённых вариантов.</small></span></li><li><b>2</b><span><strong>Вы проверяете бокс</strong><small>Можно заменить любой товар или вернуть на доработку.</small></span></li><li><b>3</b><span><strong>Заказ оформляет родитель</strong><small>Без вашего подтверждения оплаты не будет.</small></span></li></ul><div class="notice">Задание готово к отправке на ${state.orderMode==='today'?'сегодня':state.orderMode==='tomorrow'?'завтра':'выбранную дату'}.</div><button class="button" onclick="back()">Изменить, кто собирает →</button>`);
    }
    function clearAnalysis(){analysisTimers.forEach(clearTimeout);analysisTimers=[];state.analysisLoading=false;state.analysis=0}
    function startAnalysis(){clearAnalysis();state.analysisLoading=true;state.analysis=1;render();analysisTimers=[setTimeout(()=>{state.analysis=2;render()},1200),setTimeout(()=>{state.analysis=3;render()},2400),setTimeout(()=>{state.analysis=4;render()},3600),setTimeout(()=>{clearAnalysis();state.step=5;render()},5000)]}
    function toggleAddress(id){state.addresses.has(id)?state.addresses.delete(id):state.addresses.add(id);render()}
    function toggleLike(id){if(!safeProducts().some(p=>p.id===id))return;state.likes.has(id)?state.likes.delete(id):state.likes.add(id);render()}
    function setProductCategory(category){state.productCategory=category;render()}
    function toggleLimit(id){
      state.limits.has(id)?state.limits.delete(id):state.limits.add(id);
      const safeIds=new Set(safeProducts().map(p=>p.id));
      state.likes.forEach(productId=>{if(!safeIds.has(productId))state.likes.delete(productId)});
      state.cart.forEach(productId=>{if(!safeIds.has(productId))state.cart.delete(productId)});
      state.cartReady=false;
      render();
    }
    function setOrderMode(mode){state.orderMode=mode;render()}
    function chooseOrderOwner(owner){state.orderOwner=owner;state.step=10;render()}
    function toggleCart(id){if(!safeProducts().some(p=>p.id===id))return;state.cartReady=false;state.cart.has(id)?state.cart.delete(id):state.cart.add(id);render()}
    function confirmCart(){if(!state.cart.size)return;state.cartReady=true;render()}
    function setSubscriptionFrequency(value){state.subscriptionFrequency=value;render()}
    function dateLabel(offset){const date=new Date();date.setDate(date.getDate()+offset);return new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'short'}).format(date)}
    function resetFlow(){clearAnalysis();state.step=0;state.orderOwner=null;state.cart.clear();state.cartReady=false;state.productCategory='all';state.limits.clear();render()}
    function closeProfile(){document.querySelector('#profileSheet').hidden=true}
    document.querySelector('#profileButton').addEventListener('click',()=>{document.querySelector('#profileSheet').hidden=false})
    render();
  </script>
</body>
</html>
